<!DOCTYPE html>
<html>
  <body>
    <h1>Nginx Frontend</h1>
    <button onclick="fetchApi()">Call API</button>

    <pre id="result"></pre>

    <script>
      function fetchApi() {
        fetch("/api/hello")
          .then(r => r.text())
          .then(t => document.getElementById("result").innerText = t)
      }
    </script>
  </body>
</html>
